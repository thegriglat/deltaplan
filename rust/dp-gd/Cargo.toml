[package]
name = "dp-gd"
version = "0.1.0"
edition = "2024"
description = "DpAir (W3): gdext class over dp-air"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dp-air = { path = "../dp-air" }
godot = { version = "0.5.5", features = ["api-4-7"] }
rayon = "1"
serde_json = "1"
