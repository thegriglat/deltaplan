[package]
name = "dp-air"
version = "0.1.0"
edition = "2024"
description = "Air model boundary (W4): AirModel trait, input parsing (W5), Calm stub"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
picard_rs = { path = "../picard_rs" }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "calm"
harness = false
