[package]
name = "dp-air"
version = "0.1.0"
edition = "2024"
description = "Air model boundary (W4): AirModel trait, input parsing (W5), Calm stub"
license = "MIT"
publish = false

[lib]
# `cargo bench -- --noplot` (аргумент criterion) не должен падать на libtest библиотеки
bench = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
zstd = { version = "0.13", default-features = false }
half = "2"
sha2 = "0.10"
picard_rs = { path = "../picard_rs" }

[features]
# Читалка фикстур (tests/support/fixtures.rs) для тестов, бенчей и стенда.
fixtures = []

[dev-dependencies]
dp-air = { path = ".", features = ["fixtures"] }
criterion = { version = "0.5", default-features = false }
brotli-decompressor = "2.5"

[[bench]]
name = "calm"
harness = false

[[bench]]
name = "formula"
harness = false
