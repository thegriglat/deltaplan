<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title | default (.Date.Format "02.01.2006") }} — {{ site.Title }}{{ end }}</title>
<style>
:root { --bg:#fbfaf7; --fg:#1d1f22; --muted:#6b6f76; --accent:#1f5fa8; --rule:#e3e1dc; }
@media (prefers-color-scheme: dark) { :root { --bg:#16181b; --fg:#e6e6e3; --muted:#9aa0a8; --accent:#7fb2ee; --rule:#2c3035; } }
body { background:var(--bg); color:var(--fg); font:17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; margin:0; }
main, header, footer { max-width: 760px; margin: 0 auto; padding: 0 16px; }
header { padding-top: 32px; }
header a { color: inherit; text-decoration: none; }
h1 { font-size: 1.6em; line-height: 1.25; }
a { color: var(--accent); }
.muted, time { color: var(--muted); font-size: .9em; }
.post-list { list-style: none; padding: 0; }
.post-list li { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.post-list a { font-weight: 600; text-decoration: none; }
article img { max-width: 100%; }
code { font-size: .92em; }
footer { padding: 32px 16px 48px; }
</style>
</head>
<body>
<header><a href="{{ "/" | relURL }}"><strong>{{ site.Title }}</strong></a></header>
<main>{{ block "main" . }}{{ end }}</main>
<footer class="muted">Deltaplan · симулятор дельтаплана</footer>
</body>
</html>
