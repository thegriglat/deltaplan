  [cascade.target]
    path = '/research/heat_ca/exp1_3_6_kernels/out/exp6_time'
[[cascade]]
  title = 'Таблицы опыта 2'
  [cascade.target]
    path = '/research/heat_ca/exp2_picard/out'
[[cascade]]
