# Сайт проекта Deltaplan (GitHub Pages). Сборка: `cd site && hugo --minify`, просмотр: `hugo server`.
# Документы из docs/ и tools/research/ подключаются как есть через module mounts (не копируются),
# картинки — через assets/repo/<путь в репозитории> (публикуются только те, на которые есть ссылки).
baseURL = 'https://thegriglat.github.io/deltaplan/'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
title = 'Deltaplan'
theme = 'hugo-book'
buildFuture = true
enableGitInfo = false
disablePathToLower = true
enableRobotsTXT = true
refLinksErrorLevel = 'ERROR'
disableKinds = ['taxonomy', 'term']

[languages]
  [languages.en]
    weight = 1
    label = 'English'
    locale = 'en-US'
    [languages.en.params]
      BookDateFormat = 'Jan 2, 2006'
      description = 'Deltaplan is a non-commercial open-source hang glider simulator: flight, atmosphere, terrain of real places, network play.'
  [languages.ru]
    weight = 2
    label = 'Русский'
    locale = 'ru-RU'
    [languages.ru.params]
      BookDateFormat = '02.01.2006'
      description = 'Deltaplan — некоммерческий симулятор дельтаплана с открытым кодом: полёт, атмосфера, рельеф реальных мест, сетевая игра.'

[pagination]
  pagerSize = 20

# Дата записи дневника — из имени файла (2026-09-30.md или 2026-09-30-что-угодно.md)
[frontmatter]
  date = [':filename', ':default']

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['$$', '$$'], ['\[', '\]']]
      inline = [['\(', '\)']]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.highlight]
    style = 'github'

[params]
  BookTheme = 'auto'
  BookToC = true
  BookSection = '/'
  BookSearch = true
  BookComments = false
  BookRepo = 'https://github.com/thegriglat/deltaplan'
  BookBreadcrumbs = true
  # Ссылки на файлы репозитория (код, данные) ведут сюда
  repoBlob = 'https://github.com/thegriglat/deltaplan/blob/main/'
  repoCommit = 'https://github.com/thegriglat/deltaplan/commit/'
  itch = 'https://thegriglat.itch.io/deltaplan'

  # Соответствие «путь в content/ ↔ путь в репозитории» для подключённых документов.
  # Нужен ссылкам и картинкам: относительная ссылка в документе считается от его места в репозитории.
  # Порядок важен: сначала более длинные префиксы.
  [[params.repoMap]]
    content = 'plans/archive/'
    repo = 'docs/archive/plan/'
  [[params.repoMap]]
    content = 'plans/'
    repo = 'docs/plan/'
  [[params.repoMap]]
    content = 'research/findings'
    repo = 'docs/registry/findings'
  [[params.repoMap]]
    content = 'research/docs/'
    repo = 'docs/research/'
  [[params.repoMap]]
    content = 'research/heat_ca/'
    repo = 'tools/research/heat_ca/'
  [[params.repoMap]]
    content = 'research/air3d/'
    repo = 'tools/research/air3d/'
  [[params.repoMap]]
    content = 'research/askervein/'
    repo = 'tools/research/data/askervein/'
  [[params.repoMap]]
    content = 'docs/'
    repo = 'docs/'
  [[params.repoMap]]
    content = ''
    repo = 'site/content/'

# Разделы без собственной шапки
[[cascade]]
  bookCollapseSection = true
  [cascade.target]
    path = '{/plans/game,/plans/archive,/plans/archive/*,/research/heat_ca,/research/heat_ca/*,/research/air3d,/research/air3d/*,/research/docs,/docs}'
    kind = 'section'
# Детали подключённых документов не засоряют боковое меню: они доступны из страниц-оглавлений
[[cascade]]
  bookHidden = true
  [cascade.target]
    path = '{/plans/**,/research/docs,/research/docs/**,/research/heat_ca,/research/heat_ca/**,/research/air3d,/research/air3d/**,/research/askervein,/research/askervein/**}'
[[cascade]]
  type = 'posts'
  [cascade.target]
    path = '{/diary,/diary/**}'

