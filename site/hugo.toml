# Сайт проекта Deltaplan (GitHub Pages). Сборка: `cd site && hugo --minify`, просмотр: `hugo server`.
# Документы из docs/ и tools/research/ подключаются как есть через module mounts (не копируются),
# картинки — через assets/repo/<путь в репозитории> (публикуются только те, на которые есть ссылки).
baseURL = 'https://thegriglat.github.io/deltaplan/'
locale = 'ru-RU'
defaultContentLanguage = 'ru'
title = 'Deltaplan'
theme = 'hugo-book'
buildFuture = true
enableGitInfo = false
disablePathToLower = true
enableRobotsTXT = true
refLinksErrorLevel = 'ERROR'
disableKinds = ['taxonomy', 'term']

[pagination]
  pagerSize = 20

# Дата записи дневника — из имени файла (2026-09-30.md или 2026-09-30-что-угодно.md)
[frontmatter]
  date = [':filename', ':default']

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['$$', '$$'], ['\[', '\]']]
      inline = [['\(', '\)']]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.highlight]
    style = 'github'

[params]
  BookTheme = 'auto'
  BookToC = true
  BookSection = '/'
  BookSearch = true
  BookComments = false
  BookDateFormat = '02.01.2006'
  BookRepo = 'https://github.com/thegriglat/deltaplan'
  BookBreadcrumbs = true
  description = 'Deltaplan — некоммерческий симулятор дельтаплана с открытым кодом: полёт, атмосфера, рельеф реальных мест, сетевая игра.'
  # Ссылки на файлы репозитория (код, данные) ведут сюда
  repoBlob = 'https://github.com/thegriglat/deltaplan/blob/main/'
  repoCommit = 'https://github.com/thegriglat/deltaplan/commit/'
  itch = 'https://thegriglat.itch.io/deltaplan'

  # Соответствие «путь в content/ ↔ путь в репозитории» для подключённых документов.
  # Нужен ссылкам и картинкам: относительная ссылка в документе считается от его места в репозитории.
  # Порядок важен: сначала более длинные префиксы.
  [[params.repoMap]]
    content = 'research/plan/'
    repo = 'docs/plan/'
  [[params.repoMap]]
    content = 'research/notes/'
    repo = 'docs/research/'
  [[params.repoMap]]
    content = 'research/heat_ca/'
    repo = 'tools/research/heat_ca/'
  [[params.repoMap]]
    content = 'research/air3d/'
    repo = 'tools/research/air3d/'
  [[params.repoMap]]
    content = 'research/askervein/'
    repo = 'tools/research/data/askervein/'
  [[params.repoMap]]
    content = 'docs/'
    repo = 'docs/'
  [[params.repoMap]]
    content = ''
    repo = 'site/content/'

# Разделы без собственной шапки
[[cascade]]
  bookCollapseSection = true
  [cascade.target]
    path = '{/research/plan/*,/research/heat_ca/*,/research/air3d/*,/research/notes}'
    kind = 'section'
[[cascade]]
  type = 'posts'
  [cascade.target]
    path = '{/diary,/diary/**}'

# Порядок и заголовки подключённых разделов/таблиц без шапки
[[cascade]]
  weight = 1
  [cascade.target]
    path = '/research/plan'
[[cascade]]
  weight = 2
  title = 'Исследования и источники'
  [cascade.target]
    path = '/research/notes'
[[cascade]]
  weight = 3
  [cascade.target]
    path = '/research/heat_ca'
[[cascade]]
  weight = 4
  [cascade.target]
    path = '/research/air3d'
[[cascade]]
  weight = 5
  [cascade.target]
    path = '/research/askervein'
[[cascade]]
  weight = 1
  title = 'Результаты базового прототипа'
  [cascade.target]
    path = '/research/heat_ca/out'
[[cascade]]
  weight = 1
  [cascade.target]
    path = '/research/heat_ca/out/summary'
[[cascade]]
