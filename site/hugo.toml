[module]
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'static'
    target = 'static'
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'

  # --- Документация модулей: docs/*.md (без подпапок) ---
  [[module.mounts]]
    source = '../docs'
    target = 'content/docs'
    files = ['/*.md']

  # --- Планы: docs/plan/ (README.md → _index.md раздела) ---
  [[module.mounts]]
    source = '../docs/plan'
    target = 'content/research/plan'
    files = ['! README.md', '! **/README.md', '*.md', '**/*.md']
  [[module.mounts]]
    source = '../docs/plan/README.md'
    target = 'content/research/plan/_index.md'
  [[module.mounts]]
    source = '../docs/plan/atmosphere/README.md'
    target = 'content/research/plan/atmosphere/_index.md'
  [[module.mounts]]
    source = '../docs/plan/build/README.md'
    target = 'content/research/plan/build/_index.md'
  [[module.mounts]]
    source = '../docs/plan/game/README.md'
    target = 'content/research/plan/game/_index.md'
  [[module.mounts]]
    source = '../docs/plan/tasks/README.md'
    target = 'content/research/plan/tasks/_index.md'
  [[module.mounts]]
    source = '../docs/plan/terrain/README.md'
    target = 'content/research/plan/terrain/_index.md'
  [[module.mounts]]
    source = '../docs/plan/ui/README.md'
    target = 'content/research/plan/ui/_index.md'
  [[module.mounts]]
    source = '../docs/plan/vegetation/README.md'
    target = 'content/research/plan/vegetation/_index.md'

  # --- Исследования и источники: docs/research/ ---
  [[module.mounts]]
    source = '../docs/research'
    target = 'content/research/notes'
    files = ['*.md', '**/*.md']

  # --- Прототип «нагрев → плавучесть → поток» (2D): tools/research/heat_ca/ ---
  [[module.mounts]]
    source = '../tools/research/heat_ca'
    target = 'content/research/heat_ca'
    files = ['! README.md', '! **/README.md', '! out/refs/**', '*.md', '**/*.md']
  [[module.mounts]]
    source = '../tools/research/heat_ca/README.md'
    target = 'content/research/heat_ca/_index.md'
  [[module.mounts]]
    source = '../tools/research/heat_ca/exp1_3_6_kernels/README.md'
    target = 'content/research/heat_ca/exp1_3_6_kernels/_index.md'
  [[module.mounts]]
    source = '../tools/research/heat_ca/exp2_picard/README.md'
    target = 'content/research/heat_ca/exp2_picard/_index.md'
  [[module.mounts]]
    source = '../tools/research/heat_ca/exp4_transfer_sweeps/README.md'
    target = 'content/research/heat_ca/exp4_transfer_sweeps/_index.md'
  [[module.mounts]]
    source = '../tools/research/heat_ca/exp5_adi/README.md'
    target = 'content/research/heat_ca/exp5_adi/_index.md'

  # --- 3D-эталон: tools/research/air3d/ ---
  [[module.mounts]]
    source = '../tools/research/air3d'
    target = 'content/research/air3d'
    files = ['! README.md', '! **/README.md', '! fields/**', '*.md', '**/*.md']
  [[module.mounts]]
    source = '../tools/research/air3d/README.md'
    target = 'content/research/air3d/_index.md'

  # --- Данные Askervein ---
  [[module.mounts]]
    source = '../tools/research/data/askervein/README.md'
    target = 'content/research/askervein/_index.md'

  # --- Весь репозиторий как assets/repo/<путь>: картинки и 3D-страницы публикуются
  #     только если на них есть ссылка; для остальных файлов — проверка существования,
  #     ссылка ведёт на GitHub. Тяжёлое и служебное исключено.
  [[module.mounts]]
    source = '..'
    target = 'assets/repo'
    files = ['! .git/**', '! .godot/**', '! .ruff_cache/**', '! build/**', '! site/public/**', '! site/resources/**', '! site/themes/**', '! **/__pycache__/**', '! **.import', '! **.npz', '! tools/research/air3d/fields/**', '! data/terrain/reference/**']
