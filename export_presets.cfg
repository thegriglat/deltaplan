[preset.0]

name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features="forced_dd3d"
export_filter="all_resources"
include_filter="configs/*.json, configs/**/*.json, data/*, data/**/*, *.onnx, ASSETS.md, assets/sounds/LICENSES.md, assets/fonts/*.txt"
exclude_filter="tests/*, tools/*, docs/*, site/*, data/terrain/reference/*"
export_path="build/linux/deltaplan.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
shader_baker/enabled=true

