# Рельефы П-2 (NN-P4, контракт П6 v1): terrain_cut.py screen → select → fetch → cut.
# Пути — от AIR_NN_DATA (окружение) или data_root; --root КАТАЛОГ — всё в одном временном корне (тесты).
data_root: /home/greg/air_nn_data
paths:
  raw: pilot/raw            # raw/terrarium/<z>/<x>/<y>.png — раскладка кеша игры (user://terrain_cache/terrarium/…)
  out: pilot/tiles/v1       # manifest.json, index.csv, cut/<id>.npz, figures/
  work: pilot/tmp/terrain_v1  # экран, выбор, вырезки всех мест (с запасом), логи

# Источник и путь рельефа — из конфига игры (configs/world.json → runtime_terrain): шаблон URL, User-Agent,
# слой detail (size_km, zoom, min_spacing_m, chunk_cells). Здесь — только вежливость загрузки.
source:
  layer: detail
  workers: 16               # потоков загрузки (вежливо: ≤ 16)
  retries: 6                # повторов на тайл (сетевые ошибки, 5xx), пауза backoff_s · 2^k
  backoff_s: 2.0
  timeout_s: 30

# Квадрат места: 38,4 км = 96 клеток по 400 м (область решателя пилота). Сетка кандидатов — строки по широте
# с шагом grid_step_km (чуть больше 38,4 км: запас на разницу метрики web-mercator у центров), в строке —
# равный шаг по долготе ≥ grid_step_km на широте строки → квадраты сетки не перекрываются по построению.
square_km: 38.4
grid_step_km: 38.6

screen:
  lat_range: [-56.0, 70.0]  # Антарктиду и Арктику не берём
  z_mask: 5                 # грубая маска гор: размах в квадрате по z5 (≈ 4,9 км/пикс на экваторе)
  mask_relief_min_m: 150    # z5 сглаживает: 150 м по z5 ≈ 300–500 м по 400 м
  mask_sea_max: 0.5         # доля пикселей ≤ 0,5 м по z5
  z_cand: 8                 # признаки кандидатов по z8 (611·cos φ м/пикс ≈ клетка 400 м)
  grid_seed: 20261004       # сдвиг сетки (доля шага по широте и долготе)

select:
  seed: 20261005
  # слои уклона p50 (|∇hc400|, м/м): границы; мест на слой; нехватка крутого слоя переносится в соседний положе
  strata: [0.0, 0.06, 0.12, 0.2, 0.3, 0.4, .inf]
  per_stratum: 50
  relief_bins: [0, 1000, 2000, 3000]   # внутри слоя — по кругу по корзинам размаха (разнообразие)
  reserve: 0.12             # запас мест сверх цели (точные признаки после вырезки могут не пройти пороги)
  slope_est_scale: 1.0      # уклон z8 ≈ 400 м: отношение точного к оценке 0,96–1,00 на 4 местах пробы (README)
  relief_min_m: 200         # оценка по z8: ниже — не горы
  relief_max_est_m: 3100    # оценка по z8 (z8 завышает размах на ~4 % против hc400 — проба; точный фильтр — в cut)
  relief_max_m: 3000        # решение пользователя 02.10 (контракт П6): размах hc400 ≤ 3000 м
  sea_max: 0.05             # доля узлов h ≤ 0,5 м (sea_frac) — порог для оценки и для вырезки
  system_cap: 0.12          # доля пула на одну горную систему
  other_cap: 0.35           # доля пула вне перечисленных систем
  exclude:                  # места пула не ближе km к точке (Онгудай — вне обучения)
    - {name: ongudai, location: ongudai, km: 100.0}
  holdout:
    systems: [caucasus, pyrenees, appalachians]   # решение пользователя 02.10
    per_system: 15
    reserve: 3
    pool_min_km: 50.0       # отложенные места не ближе к местам пула (центры)

# Справочные вырезки тем же путём (не в индексе): сравнение Terrarium с Copernicus встроенных мест.
ref_cuts: [ongudai, altai]

# Горные системы: боксы [lat_min, lat_max, lon_min, lon_max]; первый подходящий — система места, иначе other.
