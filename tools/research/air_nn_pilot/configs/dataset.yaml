# Набор пилота air-nn (NN-P1): генератор dataset.py. Пути — от AIR_NN_DATA (окружение) или data_root ниже.
data_root: /home/greg/air_nn_data      # по умолчанию; AIR_NN_DATA из окружения и --data-root важнее

plan:
  airlite_seed: 20261001     # план air-lite (research/air-lite 7cc7e33, gen.py make_plan): 4 места × 110 + 5 синтетик × 50
  n_real: 110
  n_synth: 50
  proc_seed: 20261002        # рельефы p_000…: procedural.params(k) = default_rng([proc_seed, k])
  n_proc: 40
  proc_cond_seed: 20261003   # условия процедурных — тем же распределением, что синтетика air-lite (plan_rows)
  n_proc_cond: 30

run:
  batch_s: 300               # замок GPU (/tmp/heat_ca_gpu.lock) — на пачку случаев не дольше, между пачками отпускается
  max_failures: 3            # упавший случай (исключение) повторяется, пока ошибок < max_failures
  min_free_gb: 5             # свободное место на диске данных перед пачкой; меньше — мягкая остановка (код 3)

# Наборы: подмножества плана main (те же id и условия → те же файлы). places — список мест; n_cond — первые N условий места.
datasets:
  main: {}                               # весь план: 690 air-lite + n_proc × n_proc_cond процедурных
  # мини-прогон run_pilot.sh --smoke (не пишет в main): ongudai — (б); s_hill и p_000…p_002 — обучение, (а) и кривая (в) 2/4
  smoke: {places: [ongudai, s_hill, p_000, p_001, p_002], n_cond: 3}
  chaos: {places: [s_hill, s_ridge, p_001, p_002], n_cond: 2}   # тест прерывания (во временном AIR_NN_DATA)
