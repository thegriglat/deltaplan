// Контракт данных корпуса air-synth — модельные рельефы и условия для сети ветра.
// Человеческое описание, инварианты, раскладка каталогов и шардов — docs/contracts/air-synth.md
// (контракты S1 «рельеф и корпус», S2 «условия»; версия контракта — поле contract в манифесте).
//
// Правила эволюции (обязательны):
//   - только добавлять поля и сообщения с новыми номерами;
//   - не менять номер, тип или смысл существующего поля; удалённое поле — в reserved;
//   - смена смысла (единицы, порядок осей, кодировка высот) = новая версия контракта
//     через координатора модуля, с правкой потребителей в том же шаге.
//
// Система координат: x — восток, y — север, метры от центра области; область
// x, y ∈ [−19 200, 19 200] м (как вырезки П6 air-nn и область сети P2, 96 × 96 по 400 м).
// Высоты — метры над уровнем моря.

syntax = "proto3";

package deltaplan.air_synth.v1;

option go_package = "deltaplan/air_synth/v1;airsynthv1";

// ---------------------------------------------------------------- S1: рельеф

// Сетка высот, квантованная в int16.
// h[j][i] = offset_m + scale_m * q[j][i], q — int16 little-endian, построчно:
// индекс в массиве k = j * nx + i; i — восток (x растёт с i), j — север (y растёт с j),
// j = 0 — южный ряд. Значение — средняя высота клетки (центр клетки
// x = x0_m + (i + 0.5) * dx_m, y = y0_m + (j + 0.5) * dx_m). len(h_i16) == 2 * nx * ny.
message HeightGrid {
  uint32 nx = 1;
  uint32 ny = 2;
  double dx_m = 3;       // шаг клетки, м (квадратные клетки)
  double x0_m = 4;       // западный край области (край клетки i = 0), м
  double y0_m = 5;       // южный край области (край клетки j = 0), м
  double offset_m = 6;   // смещение высот, м
  double scale_m = 7;    // шаг квантования, м (> 0)
  bytes h_i16 = 8;       // int16 LE, порядок — выше
}

// Форма поля поднятия (план §2 «Формы»). Координаты — в системе области, м.
message Form {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    RIDGE = 1;       // гребень: H·exp(−v²/2σ²)·S(u/L), асимметрия склонов
    BLOB = 2;        // пупырь: эллиптический гаусс
    STEP = 3;        // уступ / край плато
  }
  Kind kind = 1;
  double x_m = 2;
  double y_m = 3;
  double theta_rad = 4;   // угол оси u (простирания) от оси x против часовой
  double height = 5;      // безразмерная высота формы в поле поднятия
  double sigma_m = 6;     // ширина поперёк (σ, у пупыря — σ₁)
  double sigma2_m = 7;    // у пупыря — σ₂; у гребня — σ второго склона (асимметрия), 0 — как sigma_m
  double length_m = 8;    // длина плашки гребня L (у пупыря 0)
  double edge = 9;        // крутизна концов плашки (безразмерная)
  double asym = 10;       // асимметрия (как в прототипе forms.ridge)
}

// Все параметры генерации одного рельефа. Вместе с (corpus_seed, id, generator_version)
// однозначно задают рельеф: повтор генерации даёт побитно те же высоты (до квантования).
message GenParams {
  double mix = 1;              // 0 — тип «Аскарово» (низкогорье, длинный хребет), 1 — тип «Онгудай»; непрерывно
  // сетка расчёта
  uint32 n_compute = 2;        // узлов по стороне расчёта (прототип 512)
  double dx_compute_m = 3;     // шаг расчёта, м (100)
  // поднятие
  double uplift_max_m_per_yr = 4;   // U₀
  double uplift_floor = 5;          // U = U₀·(floor + (1 − floor)·u)
  double fourier_amp = 6;           // вклад гауссова поля в u
  double fourier_beta = 7;          // спектр гауссова поля (профиль ~ k^−β)
  double anisotropy = 8;            // вытянутость поля поднятия/пород вдоль простирания (0 — изотропно)
  double strike_rad = 9;            // общее простирание
  repeated Form forms = 10;
  // породы
  double k0 = 11;                   // K₀ stream power law (м^(1−2m)/год)
  double k_logsd = 12;              // неоднородность: K = K₀·exp(k_logsd·g)
  double k_beta = 13;               // спектр поля g
  // эрозия
  double m_exp = 14;
  double n_exp = 15;
  double diffusion_m2_per_yr = 16;  // D
  double tan_crit = 17;             // предел тепловой эрозии (tan 35° по умолчанию)
  uint32 thermal_passes = 18;
  double t_total_yr = 19;           // T — одинаковое для корпуса (решение 04.10)
  double dt_yr = 20;
  double noise_m = 21;              // начальный шум
  double base_elevation_m = 22;     // высота базиса (край расчёта), м над морем
  // прочие ручки версии генератора, которых нет в именованных полях (имя → значение)
  map<string, double> extra = 30;
}

// Дешёвые сводки для отбора и проверки (не вход сети).
message ReliefSummary {
  double h_min_m = 1;               // по g400
  double h_max_m = 2;
  double relief_m = 3;              // h_max − h_min по g400
  double slope_mean_deg_400 = 4;    // средний уклон, центральные разности, без 1 клетки у края
  double slope_p95_deg_100 = 5;     // 95-й процентиль уклона на g100
  double compute_seconds = 6;       // время генерации (информативно, не входит в побитный повтор)
}

message Relief {
  uint64 id = 1;                    // номер рельефа в корпусе
  uint64 corpus_seed = 2;           // зерно корпуса; ГСЧ рельефа = SeedSequence([corpus_seed, id])
  string generator_version = 3;     // напр. "fs1-<7 знаков хеша кода генератора>"
  GenParams params = 4;
  HeightGrid g100 = 5;              // 384 × 384, dx 100 м (центр расчётной сетки)
  HeightGrid g400 = 6;              // 96 × 96, dx 400 м = блочное среднее 4 × 4 клеток g100 (до квантования)
  ReliefSummary summary = 7;
  reserved 8 to 15;                 // будущее: ссылки на поля решателя (S1 «потом»)
  Place place = 16;                 // S1 v2: только у реальных рельефов (у модельных не заполняется)
}

// S1 v2: реальное место (рельеф из карт, конвейер вырезок П6 air-nn).
message Place {
  string name = 1;                  // id места: "t_0000"… (индекс П6 v3) или "askarovo"… (места игры)
  double lat_deg = 2;               // центр области
  double lon_deg = 3;
  string system = 4;                // горная система (ключ конфига П6) или "other"
  string part = 5;                  // "pool" | "holdout" | "game"
  string stratum = 6;               // слой стратификации П6
  string source = 7;                // источник высот, напр. "terrarium z12" / "copernicus glo-30"
  uint32 zoom = 8;
  double src_spacing_m = 9;         // шаг исходных узлов, м
  string source_sha256 = 10;        // хеш исходной вырезки (до упаковки)
  map<string, string> extra = 11;
}

// ---------------------------------------------------------------- шарды и индекс

// Шард — файл подряд идущих записей: varint32 длина + байты сообщения (protobuf delimited,
// как writeDelimitedTo). Индекс — одно сообщение ShardIndex в файле index.pb.
message IndexEntry {
  uint64 id = 1;
  uint32 shard = 2;     // номер шарда (имя файла — по манифесту)
  uint64 offset = 3;    // смещение начала записи (префикса длины) в файле шарда, байт
  uint32 length = 4;    // длина сообщения без префикса, байт
  uint32 cond_id = 5;   // для условий (S2); у рельефов 0
  double mix = 6;       // копии для отбора без чтения записей
  double relief_m = 7;
}

message ShardIndex {
  string kind = 1;                  // "relief" | "conditions"
  repeated IndexEntry entries = 2;  // по возрастанию (id, cond_id)
}

message CorpusManifest {
  string contract = 1;              // "S1 v1" (рельефы) или "S2 v1" (условия)
  string name = 2;                  // имя корпуса или набора условий
  string kind = 3;                  // "relief" | "conditions"
  string generator_version = 4;
  uint64 corpus_seed = 5;
  uint64 n_records = 6;
  uint32 shard_size = 7;            // записей в шарде: шард k — id [k·S, (k+1)·S)
  string shard_pattern = 8;         // напр. "reliefs-{shard:05d}.pb"
  bool complete = 9;
  string command = 10;              // команда запуска
  string git_commit = 11;
  string created = 12;              // ISO-время
  string relief_corpus = 13;        // для условий: каталог корпуса рельефов, на который ссылаются
  map<string, string> notes = 14;
}

// ---------------------------------------------------------------- S2: условия

// Исходные условия — как случай P2 (air_nn_pilot/airlite_gen.plan_rows + places.context):
// по ним решатель (air3d/weather) строит профиль притока, нагрев и слой перемешивания.
message Conditions {
  uint64 relief_id = 1;             // ссылка на Relief.id корпуса manifest.relief_corpus
  uint32 cond_id = 2;               // номер условия у рельефа (0, 1, …)
  uint64 cond_seed = 3;             // зерно набора условий
  // исходные (вход решателя)
  double u10_m_s = 4;               // ветер на 10 м
  double wind_from_deg = 5;         // откуда дует, ° от севера по часовой
  double hour_local = 6;            // местное солнечное время, ч
  string sky = 7;                   // "clear" | "partly" | "overcast"
  double t_max_c = 8;               // максимум температуры дня, °C
  uint32 month = 9;
  uint32 day = 10;
  double lat_deg = 11;              // условная точка (для солнца), рельеф модельный
  double lon_deg = 12;
  double utc_offset_h = 13;
  // производные (как их вычисляет решатель при построении случая; для отбора и FiLM)
  Derived derived = 14;
  // H5 (позже): явная стратификация вместо построенной по погоде; сейчас не заполняется
  StratOverride strat_override = 15;
}

message Derived {
  double alpha = 1;                 // показатель профиля притока (profile)
  double max_profile = 2;
  double z_i_m = 3;                 // слой перемешивания, м над морем
  double z_lcl_m = 4;               // уровень конденсации, м над морем
  double heat = 5;                  // day.heat
  double brk = 6;                   // day.brk
  uint32 stability_class = 7;       // A…F → 0…5
  bool has_cap = 8;
  double cap_agl_m = 9;
  double sun_el_deg = 10;
  double sun_az_deg = 11;
  double t_c = 12;                  // температура в час случая, °C
  double n_bv_s = 13;               // частота Брента — Вяйсяля над слоем перемешивания, 1/с
  double froude = 14;               // Fr = U / (N·H), H — перепад рельефа (определение — в контракте S2)
  double w_star_m_s = 15;           // конвективный масштаб w*
  double w_star_over_u = 16;        // w*/U; механический режим — < 0,5
  bool mechanical = 17;             // w*/U < 0,5
}

message StratOverride {
  bool enabled = 1;
  double n_bv_s = 2;                // постоянная N над слоем перемешивания
  double z_i_agl_m = 3;
  repeated double theta_profile_k = 4;   // θ(z) на высотах theta_z_m (если задан — вместо n_bv_s)
  repeated double theta_z_m = 5;
}
