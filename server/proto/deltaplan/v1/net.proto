// Контракт сетевой игры Deltaplan — единственный источник правды о сообщениях.
//
// Транспорт: один WebSocket на клиента, ws://IP:порт/v1/ws. Каждый текстовый
// кадр — ровно одно сообщение Envelope в кодировке proto3 JSON (Go: protojson;
// ключи lowerCamelCase, перечисления — именами, значения по умолчанию опускаются).
// Человеческое описание, примеры JSON и сценарии — docs/net_protocol.md.
//
// Правила эволюции (обязательны):
//   - только добавлять новые поля и сообщения с новыми номерами;
//   - никогда не менять номер, тип или смысл существующего поля, не переиспользовать
//     номера удалённых полей (удалённое поле — в reserved);
//   - неизвестные поля и значения игнорируются: сервер разбирает с
//     protojson DiscardUnknown, клиент пропускает незнакомые ключи и незнакомые
//     варианты Envelope.
//
// Мир (термики, облака, ветер) по сети не передаётся: каждый клиент считает его
// сам по параметрам зоны (Zone) и часам зоны (ZoneState.clock). Исключение —
// источники термиков из поля воздуха (ZoneState.thermal_sources): их выбирает ведущий.
//
// Система координат (pos, vel, rot): мир Godot, метры. X — восток, Y — вверх,
// −Z — север (+Z — юг). Начало координат — то же, что у локального мира,
// построенного по Zone (одинаково у всех клиентов зоны).

syntax = "proto3";

package deltaplan.v1;

option go_package = "deltaplan/server/gen/deltaplan/v1;deltaplanv1";

// Конверт: одно сообщение на один текстовый кадр WebSocket, в обе стороны.
// Установлен ровно один вариант msg. Незнакомый вариант (новее версии клиента)
// приходит как незнакомый ключ — его пропускают.
message Envelope {
  // Id пилота-отправителя. Заполняет только сервер, когда пересылает сообщение
  // внутри зоны (PilotState, ZoneState); значение от клиента сервер затирает.
  // В остальных сообщениях пусто. Для ботов from_id — ведущий, а
  // PilotState.pilot_id — id бота.
  string from_id = 1;

  oneof msg {
    // Клиент → сервер.
    Hello hello = 10;
    CreateZone create_zone = 11;
    JoinZone join_zone = 12;
    LeaveZone leave_zone = 13;
    Ping ping = 14;

    // Сервер → клиент.
    Welcome welcome = 30;
    ZoneCreated zone_created = 31;
    ZoneJoined zone_joined = 32;
    PeerJoined peer_joined = 33;
    PeerLeft peer_left = 34;
    LeaderChanged leader_changed = 35;
    Error error = 36;
    Pong pong = 37;

    // Пересылаются сервером внутри зоны (клиент → сервер → остальные в зоне).
    PilotState pilot_state = 50;
    ZoneState zone_state = 51;
  }
}

// ---------------------------------------------------------------------------
// Общие типы
// ---------------------------------------------------------------------------

// Вектор в мире Godot: X — восток, Y — вверх, −Z — север.
message Vec3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

// Кватернион ориентации (как Godot Quaternion из Basis крыла). Единичный
// поворот — {"w": 1}: нулевые x, y, z опускаются в JSON.
message Quat {
  float x = 1;
  float y = 2;
  float z = 3;
  float w = 4;
}

// Прогноз погоды зоны (как в меню «Полёт…», FlightSettings). Остальная погода
// выводится из прогноза, даты и места (WeatherModel) на каждом клиенте.
message Forecast {
  // Температура днём (максимум у земли в долине), °C.
  float temperature_c = 1;
  // Ветер у земли, км/ч.
  float wind_speed_kmh = 2;
  // true — ветер в лоб выбранному старту (направление подставляет игра),
  // false — с направления wind_from_deg.
  bool wind_into_launch = 3;
  // Откуда дует ветер, градусы: 0 — с севера, 90 — с востока. Используется,
  // если wind_into_launch = false.
  float wind_from_deg = 4;
  // Облачность: "clear" | "partly" | "overcast" (configs/weather_model.json → sky).
  string sky = 5;
}

// Параметры зоны — всё, из чего клиент детерминированно строит один и тот же
// мир. Задаёт создатель зоны (CreateZone), сервер хранит и отдаёт входящим
// (ZoneJoined), не разбирая смысла. Крыло и масса пилота — у каждого свои,
// в Zone их нет.
message Zone {
  // Встроенная локация: "altai" (configs/locations/<id>.json).
  string location_id = 1;
  // Стартовая площадка локации; пусто — первая.
  string site_id = 2;
  // Точка с карты, градусы широты/долготы. Не задана — полёт на встроенной
  // локации (в FlightSettings это NAN). В JSON поле отсутствует, если не задано.
  optional double pick_lat = 3;
  optional double pick_lon = 4;
  // Дата: месяц 1–12, число 1–31.
  int32 month = 5;
  int32 day = 6;
  // Время старта, часы (13.5 — 13:30). Время суток в зоне =
  // start_hour + ZoneState.clock / 3600.
  double start_hour = 7;
  Forecast forecast = 8;
  // Сид генератора мира (термики, облака). Выбирает создатель зоны.
  uint32 seed = 9;
  // Число ботов (из настроек создателя). При смене ведущего не меняется.
  int32 bots_count = 10;
  // Канонический «ключ мира»: все параметры, от которых зависит мир (координаты
  // точки старта, дата, час старта, прогноз, сид, число ботов) плюс версия
  // генератора мира v, одной строкой в URL-виде: ключи по алфавиту, формат
  // чисел фиксирован (lat/lon — 5 знаков), все ключи всегда (hdg — по желанию):
  // deltaplan://world?bots=4&date=2026-07-15&from=270&hour=13.00&lat=50.75120&lon=86.12030&seed=4711&sky=clear&temp=26.0&v=1&wind=3.0
  // Часы зоны сюда не входят. Заполняет клиент создателя
  // (FlightSettings.world_key); сервер пересылает как есть и не разбирает.
  // Пусто — создатель старой версии.
  string world_key = 11;
  // Первые 16 hex-символов (строчные) SHA-256 от world_key. Вошедший строит мир
  // из полей Zone, считает свой ключ и сверяет хэш: не совпал — миры разные
  // (разные версии генератора). Пусто — не проверять.
  string world_hash = 12;
}

// Живой пилот в зоне.
message Peer {
  // Id пилота, выдан сервером (Welcome.your_id).
  string id = 1;
  // Имя пилота из Hello.
  string name = 2;
  // Порядок подключения к зоне: 1 — создатель, дальше по возрастанию.
  // Ведущий — живой пилот с наименьшим join_order.
  uint32 join_order = 3;
}

// Расцветка паруса (как bots.json → visual.sail_schemes): основной цвет
// текстуры крыла поворачивается к тону hue_deg, белое остаётся белым.
message WingColors {
  // Тон, градусы 0–360.
  float hue_deg = 1;
  // Множитель насыщенности (1 — как у схемы).
  float sat = 2;
  // Множитель яркости (1 — как у схемы).
  float value = 3;
}

// ---------------------------------------------------------------------------
// Клиент → сервер
// ---------------------------------------------------------------------------

// Первое сообщение после подключения. Шлёт клиент один раз; ответ — Welcome
// или Error (VERSION_MISMATCH, если сервер запущен с фиксированной версией).
message Hello {
  // Версия игры ("0.7.1", project.godot → config/version). Пилоты разных версий в одну зону не попадают.
  string game_version = 1;
  // Имя пилота из настроек, ≤ 20 символов, любой язык.
  string name = 2;
}

// Создать зону с параметрами мира. Ответ: ZoneCreated, затем ZoneJoined
// (создатель сразу в зоне и ведущий).
message CreateZone {
  Zone zone = 1;
}

// Войти в зону по коду. Ответ: ZoneJoined или Error (ZONE_NOT_FOUND,
// ZONE_FULL, VERSION_MISMATCH).
message JoinZone {
  // Код зоны, 4 цифры строкой: "4721".
  string code = 1;
}

// Выйти из зоны (соединение остаётся). Ответа нет; остальным — PeerLeft.
message LeaveZone {}

// Замер задержки и смещения часов сервера. Клиент шлёт раз в 2 с.
message Ping {
  // Время клиента в момент отправки, секунды (любые монотонные часы клиента).
  double client_time = 1;
}

// ---------------------------------------------------------------------------
// Сервер → клиент
// ---------------------------------------------------------------------------

// Ответ на Hello: соединение принято.
message Welcome {
  // Id этого пилота на время соединения ("7"). Новое соединение — новый id.
  string your_id = 1;
  // Версия сервера, для отладки.
  string server_version = 2;
}

// Зона создана. Сразу за ним приходит ZoneJoined.
message ZoneCreated {
  // Код зоны, 4 цифры строкой: "4721". Его пилоты передают друзьям.
  string code = 1;
}

// Ты в зоне (после CreateZone или JoinZone). Полное состояние зоны на момент входа.
message ZoneJoined {
  // Код зоны.
  string code = 1;
  // Параметры мира.
  Zone zone = 2;
  // Все живые пилоты зоны, включая себя, по порядку подключения.
  repeated Peer peers = 3;
  // Id ведущего.
  string leader_id = 4;
}

// В зону вошёл пилот. Всем в зоне, кроме него самого.
message PeerJoined {
  Peer peer = 1;
}

// Пилот вышел из зоны (LeaveZone или обрыв). Всем оставшимся в зоне.
message PeerLeft {
  // Id ушедшего пилота.
  string id = 1;
}

// Сменился ведущий (прежний ушёл). Всем в зоне; приходит сразу после PeerLeft.
message LeaderChanged {
  // Id нового ведущего.
  string leader_id = 1;
}

// Коды ошибок.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // Нет активной зоны с таким кодом.
  ERROR_CODE_ZONE_NOT_FOUND = 1;
  // Версия игры не совпадает с версией зоны (или сервера).
  ERROR_CODE_VERSION_MISMATCH = 2;
  // В зоне уже максимум живых пилотов (16).
  ERROR_CODE_ZONE_FULL = 3;
  // Кадр не разобран или сообщение не к месту (например, JoinZone до Hello).
  ERROR_CODE_BAD_MESSAGE = 4;
}

// Ошибка в ответ на сообщение клиента. Соединение остаётся открытым.
message Error {
  ErrorCode code = 1;
  // Пояснение для лога (по-английски); игроку показывается текст по code.
  string text = 2;
}

// Ответ на Ping.
message Pong {
  // client_time из Ping без изменений.
  double client_time = 1;
  // Время сервера в момент ответа, секунды Unix (с дробной частью).
  double server_time = 2;
}

// ---------------------------------------------------------------------------
// Пересылаемые внутри зоны
// ---------------------------------------------------------------------------

// Фаза пилота — от неё зависит поза и анимация у других.
enum PilotPhase {
  PILOT_PHASE_UNSPECIFIED = 0;
  // Стоит (на старте, в очереди, на посадке).
  PILOT_PHASE_STAND = 1;
  // Идёт пешком (к старту, в очереди).
  PILOT_PHASE_WALK = 2;
  // Разбег.
  PILOT_PHASE_RUN = 3;
  // Летит.
  PILOT_PHASE_FLY = 4;
  // Сел, стоит после посадки.
  PILOT_PHASE_LANDED = 5;
  // Авария.
  PILOT_PHASE_CRASHED = 6;
  // Буксир «догнать»: кинематический перелёт к другому пилоту (поза полёта).
  PILOT_PHASE_TOW = 7;
}

// Состояние пилота. Каждый клиент шлёт своё 10 раз в секунду; ведущий, кроме
// своего, шлёт состояния всех ботов (is_bot = true) с той же частотой. Сервер
// пересылает остальным в зоне, добавляя Envelope.from_id.
message PilotState {
  // Id пилота: для живого — его id от сервера (равен from_id), для бота —
  // id, выданный ведущим ("bot-3"); не меняется при смене ведущего.
  string pilot_id = 1;
  // true — бот (считает ведущий).
  bool is_bot = 2;
  // Имя над крылом.
  string name = 3;
  // Время зоны, секунды (ZoneState.clock), к которому относится состояние.
  double t = 4;
  // Позиция пилота, метры, мир Godot (X — восток, Y — вверх, −Z — север).
  Vec3 pos = 5;
  // Ориентация крыла (Godot Quaternion).
  Quat rot = 6;
  // Скорость относительно земли, м/с, те же оси.
  Vec3 vel = 7;
  PilotPhase phase = 8;
  // Конфиг крыла: "wings/sport".
  string wing = 9;
  // Расцветка паруса; нет — родная текстура крыла.
  WingColors colors = 10;
}

// Часы зоны и очередь на старт. Шлёт только ведущий, раз в секунду; сервер
// пересылает остальным (от не-ведущего — отбрасывает).
message ZoneState {
  // Время зоны, секунды от создания зоны. Идёт ×1, пауза его не останавливает.
  double clock = 1;
  // Очередь на старт: id пилотов, первый — тот, кто может разбегаться.
  // Сначала живые пилоты, затем боты.
  repeated string queue = 2;
  // Источники термиков из поля воздуха (docs/air_model.md → «Масштаб 2: термики из поля»):
  // поле у клиентов чуть разное (своя видеокарта), а термики должны совпадать — где они,
  // выбирает ведущий на своём поле; силу, потолок и снос каждый считает сам по своему полю.
  // Нет — поля у ведущего нет, каждый выбирает сам (без поля — аналитика, как раньше).
  ThermalSources thermal_sources = 3;
}

// Источники термиков на час: какие столбцы сетки поля — источники (AM-07).
message ThermalSources {
  // Подпись сетки уровня поля "dx,x0,y0,nx,ny" (м, м, м, столбцов; AirThermals.signature).
  // Клиент с другой сеткой список не применяет и выбирает сам.
  string grid = 1;
  // Биты столбцов-источников: бит номер j·nx + i (i — на восток, j — на север от x0, y0),
  // младший бит байта — первый. В JSON — base64.
  bytes mask = 2;
}

// ---------------------------------------------------------------------------
// Поиск зон в локальной сети (не WebSocket)
// ---------------------------------------------------------------------------

// Объявление зоны в локальной сети. Шлёт игра со встроенным сервером (NET-22),
// пока на нём есть зона: раз в секунду, одно объявление на зону, UDP broadcast
// (255.255.255.255) на порт 8081 (LanDiscovery.PORT). Одна UDP-датаграмма —
// proto3 JSON самого LanAnnounce, БЕЗ Envelope (это не кадр WebSocket).
// Слушатели показывают список «Рядом»; зона пропадает из списка через 3 с без
// объявлений. Незнакомые ключи пропускаются, как везде.
message LanAnnounce {
  // Код зоны, 4 цифры строкой: "4721".
  string code = 1;
  // Кто создал зону — для списка «Рядом: зона 4721 — Коля»: имя пилота или
  // имя пользователя компьютера.
  string host_name = 2;
  // IPv4 встроенного сервера в локальной сети ("192.168.1.5"), как его видит
  // объявляющий. Получатель берёт адрес отправителя датаграммы, если он известен
  // (он точно достижим), а это поле — только если адрес отправителя неизвестен.
  string address = 3;
  // Порт WebSocket встроенного сервера (ws://address:port/v1/ws), обычно 8080.
  uint32 port = 4;
  // Версия игры создателя (project.godot → config/version). Зона другой версии
  // в списке помечена: войти в неё нельзя (VERSION_MISMATCH).
  string game_version = 5;
  // Живых пилотов в зоне сейчас (боты не считаются).
  uint32 pilots_count = 6;
}
